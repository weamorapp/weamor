<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personality Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      max-width: 100%;
      box-sizing: border-box;
    }
    .container {
      max-width: 500px;
      margin: auto;
    }
    .question {
      margin: 20px 0;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      font-size: 16px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    canvas {
      width: 100%;
      height: auto;
      border: 1px solid #ccc;
      display: none;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Discover Your Power Personality</h1>
  <form id="quizForm">
    <div class="question">
      <label>Your Name:</label>
      <input type="text" name="username" required />
    </div>
    <div class="question">
      <label>1. Your go-to weekend plan?</label>
      <input type="radio" name="q1" value="A" required> Party hard<br>
      <input type="radio" name="q1" value="B"> Chill at home<br>
      <input type="radio" name="q1" value="C"> Explore something new
    </div>
    <!-- Repeat similar blocks for questions 2 to 10 -->
    <div class="question">
      <label>2. What kind of music do you vibe with?</label>
      <input type="radio" name="q2" value="A" required> EDM<br>
      <input type="radio" name="q2" value="B"> Lo-Fi<br>
      <input type="radio" name="q2" value="C"> Classical
    </div>
    <!-- Add more questions here in same pattern up to q10 -->
    <!-- For simplicity, let's assume only 2 for now -->

    <button type="submit">Reveal My Personality</button>
  </form>

  <canvas id="resultCanvas" width="1080" height="1920"></canvas>
  <button id="downloadBtn" style="display:none;">Download & Share</button>
</div>

<script>
const form = document.getElementById('quizForm');
const canvas = document.getElementById('resultCanvas');
const ctx = canvas.getContext('2d');
const downloadBtn = document.getElementById('downloadBtn');

form.addEventListener('submit', function(e) {
  e.preventDefault();
  const formData = new FormData(form);
  const name = formData.get('username');
  let score = 0;
  for (let i = 1; i <= 10; i++) {
    const val = formData.get('q' + i);
    if (val === 'A') score += 2;
    if (val === 'B') score += 1;
    if (val === 'C') score += 3;
  }

  const emojis = ['✨', '🔥', '🌟', '💫', '⚡', '❤️', '👑', '🌈'];
  const descriptions = [
    "You're the spark in every storm. You shine bright even on cloudy days.",
    "You lead with heart and light. People admire you for your energy and vision.",
    "A calm force of brilliance — you're unforgettable in the quietest ways.",
    "You're destined to inspire, empower, and create beautiful chaos wherever you go."
  ];
  const bgColor = ["#FFE4E1", "#FFFACD", "#E6E6FA", "#D0F0C0"];

  const desc = descriptions[Math.floor(Math.random() * descriptions.length)];
  const emoji = emojis[Math.floor(Math.random() * emojis.length)];
  const bg = bgColor[Math.floor(Math.random() * bgColor.length)];

  canvas.style.display = 'block';
  downloadBtn.style.display = 'inline-block';

  // Background
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Header
  ctx.fillStyle = '#000';
  ctx.font = 'bold 60px Arial';
  ctx.fillText(`${name}, you're...`, 100, 200);

  // Result
  ctx.font = 'bold 70px Georgia';
  ctx.fillStyle = '#D72638';
  ctx.fillText(emoji, 100, 300);

  ctx.font = '36px Arial';
  const lines = wrapText(ctx, desc, 100, 400, 880, 60);
  lines.forEach((line, i) => {
    ctx.fillText(line, 100, 400 + i * 60);
  });

  ctx.font = '24px Arial';
  ctx.fillStyle = '#333';
  ctx.fillText("Generated at xyz.com", 100, 1860);
});

downloadBtn.addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'story-personality-result.png';
  link.href = canvas.toDataURL();
  link.click();
});

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  const lines = [];
  for (let i = 0; i < words.length; i++) {
    const testLine = line + words[i] + ' ';
    const metrics = ctx.measureText(testLine);
    const testWidth = metrics.width;
    if (testWidth > maxWidth && i > 0) {
      lines.push(line);
      line = words[i] + ' ';
    } else {
      line = testLine;
    }
  }
  lines.push(line);
  return lines;
}
</script>
</body>
</html>
